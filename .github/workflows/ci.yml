# CI de Mi Grilla (FEAT-001, Block 6).
#
# - Corre al abrir, actualizar o reabrir un PR, y al mergear a `main`; nunca en un push sin PR.
# - `pull_request` y nunca `pull_request_target`: el código de un fork corre sin secretos y con un
#   token de solo lectura (R-09). El workflow no usa secretos.
# - Toda action está fijada por el SHA de su commit, con la versión en un comentario (R-10).
#   Para actualizar una: `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` (si el objeto es un
#   `tag` anotado, desreferenciarlo con `gh api repos/<owner>/<repo>/git/tags/<sha>`).
# - Los tres jobs corren en paralelo y cada uno se corta a los 10 minutos (NFR-04).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Solo en un PR: en `main`, dos merges seguidos corren completos los dos.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PRISMA_HIDE_UPDATE_MESSAGE: "1"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm, en la versión exacta de `packageManager` (package.json).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Sin DATABASE_URL: `postinstall` (prisma generate) tiene que funcionar sin la variable.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Unit con coverage: bajo 80 % líneas, 70 % ramas u 80 % funciones, falla (NFR-05).
      - run: pnpm test

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # La misma imagen que docker-compose.yml.
        image: postgres:17.12
        # Credencial de prueba descartable, NO es un secreto: la base vive en un contenedor efímero
        # del runner, solo accesible desde el job, y se destruye al terminar.
        env:
          POSTGRES_USER: mi_grilla
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mi_grilla
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mi_grilla -d mi_grilla"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # La base de tests (FIX-004): el setup de integración la pasa como DATABASE_URL. Sin
      # DATABASE_URL en el job: acá no hay base de desarrollo. Loopback del runner, sin TLS, como en
      # local (R-04).
      TEST_DATABASE_URL: postgresql://mi_grilla:ci-only-password@127.0.0.1:5432/mi_grilla
      # Secreto de prueba descartable, NO es un secreto: firma cookies de sesiones que solo existen
      # en la base efímera de este job. Nunca se usa fuera de la CI (R-13).
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-a-real-one
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migra la base de tests y le carga la grilla (data/schedule.json), que leen los tests de la
      # selección (FEAT-003a).
      - run: pnpm db:test:prepare
      - run: pnpm test:integration

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # La imagen oficial de Playwright trae WebKit, Chromium y sus bibliotecas del sistema: el job no
    # instala nada con apt ni baja navegadores, que es donde se colgaba hasta agotar el tope
    # (FIX-002). La versión es la de @playwright/test y la misma de `pnpm test:e2e:docker`; un test
    # de tests/unit/ci/workflow.test.ts exige que coincidan. Corre como root: Playwright ya lanza
    # Chromium sin sandbox y con --disable-dev-shm-usage.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    services:
      postgres:
        image: postgres:17.12
        # Credencial de prueba descartable, NO es un secreto (ver el job integration).
        env:
          POSTGRES_USER: mi_grilla
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mi_grilla
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mi_grilla -d mi_grilla"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # La base de tests (FIX-004): la config de Playwright se la pasa a `next start` como
      # DATABASE_URL. Desde el container, el service se alcanza por su nombre, no por 127.0.0.1.
      TEST_DATABASE_URL: postgresql://mi_grilla:ci-only-password@postgres:5432/mi_grilla
      # Secreto de prueba descartable, NO es un secreto (ver el job integration).
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-a-real-one
      # La URL que sirve `next start` en los E2E (playwright.config.ts), en el mismo container.
      BETTER_AUTH_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Las cuentas (FEAT-002) y la grilla (FEAT-003a) viven en la base: el esquema y la grilla
      # tienen que estar antes del primer registro, y `/` lee la grilla en cada pedido.
      - run: pnpm db:test:prepare
      # Build de producción + `next start` en el puerto 3100 (ADR-002). En un PR, solo
      # `iphone-webkit`; al mergear a `main`, los 4 proyectos (FIX-001). El evento llega por `env:`,
      # nunca interpolado en `run:`.
      - run: pnpm test:e2e $E2E_PROJECTS
        env:
          E2E_PROJECTS: ${{ github.event_name == 'pull_request' && '--project=iphone-webkit' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
